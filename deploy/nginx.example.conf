# EXEMPLO. Trocar dominio e certificados antes de instalar.
# Nao expor diretamente a internet. Usar LAN/ACL/Tailscale/Access aprovados pela TI.
server {
    listen 443 ssl;
    server_name hnsg.intranet.invalid;
    ssl_certificate /etc/ssl/hnsg/fullchain.pem;
    ssl_certificate_key /etc/ssl/hnsg/private.key;
    client_max_body_size 3m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 40s;
    }
}
